<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Volunteer Signups — Kyle Smith for Ward 4</title>
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* Rebrand 2026 -- kept in step with the tokens in index.html. The Google
       sign-in button below deliberately keeps Google's own brand colours. */
    --navy: #293f8e;
    --blue: #5d70ce;
    --gold: #f7bf0b;
    --orange: #fc7506;
    --cream: #fff2e3;
    --bg: #faf5ee;
    --line: #e5e0d8;
    --muted: #6b7684;
  }
  body {
    font-family: 'Montserrat', system-ui, sans-serif;
    background: var(--bg);
    color: #1a1a2e;
    line-height: 1.5;
    padding: 2rem 1.5rem;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { margin-bottom: 1.75rem; }
  h1 { font-size: 1.4rem; color: var(--navy); font-weight: 700; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.75rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .login { max-width: 380px; }
  label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--navy); margin-bottom: 0.4rem; }
  input[type=password], input[type=search] {
    width: 100%;
    padding: 0.7rem 0.9rem;
    border: 2px solid var(--line);
    border-radius: 8px;
    font: inherit;
    font-size: 0.95rem;
  }
  input:focus { outline: none; border-color: var(--blue); }
  button {
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 0.7rem 1.2rem;
    background: var(--navy);
    color: #fff;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: #fff; color: var(--navy); border: 2px solid var(--line); }
  .login button {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    background: #fff;
    color: #3c4043;
    border: 2px solid var(--line);
  }
  .signin-copy { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.1rem; }
  .err { color: #c0392b; font-size: 0.88rem; margin-top: 0.75rem; display: none; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 1.25rem;
  }
  .toolbar input[type=search] { flex: 1; min-width: 200px; }
  .count { color: var(--muted); font-size: 0.88rem; white-space: nowrap; }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.7rem 0.85rem; border-bottom: 1px solid var(--line); }
  th {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    font-weight: 700;
    white-space: nowrap;
  }
  tbody tr:hover { background: #fafbfc; }
  td.roles { color: var(--muted); font-size: 0.85rem; }
  td.meta { color: var(--muted); font-size: 0.85rem; white-space: nowrap; cursor: help; }
  td.date { white-space: nowrap; color: var(--muted); font-size: 0.85rem; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty { text-align: center; color: var(--muted); padding: 2.5rem 1rem; }
  #app { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Volunteer Signups</h1>
    <p class="sub">Kyle Smith for Fayetteville City Council &middot; Ward 4, Position 1</p>
  </header>

  <div class="card login" id="login">
    <p class="signin-copy">Sign in with the Google account that was granted access.</p>
    <button id="loginBtn">
      <svg viewBox="0 0 18 18" width="17" height="17" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.97 10.71a5.4 5.4 0 010-3.42V4.95H.96a9 9 0 000 8.1l3-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 00.96 4.95l3.01 2.34C4.68 5.17 6.66 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>
    <p class="err" id="loginErr"></p>
  </div>

  <div id="app">
    <div class="toolbar">
      <input type="search" id="filter" placeholder="Filter by name, email, or role...">
      <span class="count" id="count"></span>
      <button class="secondary" id="csvBtn">Download CSV</button>
      <button class="secondary" id="outBtn">Sign out</button>
    </div>
    <div class="card table-scroll">
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Email</th><th>Phone</th><th>SMS OK</th><th>Wants to help with</th><th>Sign address</th><th>Signed up</th><th>Browser</th><th>Came from</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" style="display:none">No signups match that filter.</p>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';
import { firebaseConfig } from './js/firebase-config.js';

const ENDPOINT = 'https://us-central1-kyle4fay-2026.cloudfunctions.net/listContacts';
const auth = getAuth(initializeApp(firebaseConfig));
let contacts = [];

const $ = (id) => document.getElementById(id);

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-US', {
    month: 'short', day: 'numeric', year: 'numeric'
  });
}

function render(list) {
  $('rows').innerHTML = list.map(c => `
    <tr>
      <td>${esc(c.name)}</td>
      <td><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></td>
      <td>${esc(c.phone)}</td>
      <td class="sms" title="${c.sms_consent ? 'Opted in to SMS' : 'No SMS consent on file -- do not text'}">${c.sms_consent ? 'Yes' : '--'}</td>
      <td class="roles">${esc(c.roles.join(', '))}</td>
      <td class="roles">${esc(c.sign_address || '')}</td>
      <td class="date">${fmtDate(c.created_at)}</td>
      <td class="meta" title="${esc(c.user_agent)}">${esc(shortUA(c.user_agent))}</td>
      <td class="meta" title="${esc(c.referer)}">${esc(shortRef(c.referer))}</td>
    </tr>
  `).join('');
  $('empty').style.display = list.length ? 'none' : 'block';
  $('count').textContent = list.length === contacts.length
    ? `${contacts.length} total`
    : `${list.length} of ${contacts.length}`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
  ));
}

// Raw user-agent strings are far too long for a table cell. Condense to
// browser + platform for display; the full string stays available on hover
// and is written verbatim to the CSV.
function shortUA(ua) {
  if (!ua) return '';
  const browser =
    /Edg\//.test(ua) ? 'Edge' :
    /OPR\/|Opera/.test(ua) ? 'Opera' :
    /Chrome\//.test(ua) ? 'Chrome' :
    /Safari\//.test(ua) && /Version\//.test(ua) ? 'Safari' :
    /Firefox\//.test(ua) ? 'Firefox' :
    /bot|crawl|spider|curl|wget|python|http/i.test(ua) ? 'Bot/script' : 'Other';
  const os =
    /iPhone|iPad|iPod/.test(ua) ? 'iOS' :
    /Android/.test(ua) ? 'Android' :
    /Windows/.test(ua) ? 'Windows' :
    /Mac OS X/.test(ua) ? 'macOS' :
    /Linux/.test(ua) ? 'Linux' : '';
  return os ? `${browser} / ${os}` : browser;
}

// The valuable part of a referrer is which site sent them.
function shortRef(url) {
  if (!url) return '';
  try {
    const h = new URL(url).hostname.replace(/^www\./, '');
    return h === 'kyle4fay.org' ? 'direct' : h;
  } catch {
    return url;
  }
}

function showError(msg) {
  $('loginErr').textContent = msg;
  $('loginErr').style.display = 'block';
  $('login').style.display = 'block';
  $('app').style.display = 'none';
}

async function loadContacts(user) {
  try {
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + (await user.getIdToken()),
      },
      body: '{}',
    });
    if (res.status === 403) {
      await signOut(auth);
      showError(`${user.email} doesn't have access. Ask Kyle to add this address.`);
      return;
    }
    if (!res.ok) throw new Error('Could not load signups. Try again.');
    contacts = (await res.json()).contacts;
    $('loginErr').style.display = 'none';
    $('login').style.display = 'none';
    $('app').style.display = 'block';
    render(contacts);
  } catch (err) {
    showError(err.message);
  }
}

onAuthStateChanged(auth, (user) => {
  if (user) loadContacts(user);
});

$('loginBtn').addEventListener('click', async () => {
  $('loginBtn').disabled = true;
  $('loginErr').style.display = 'none';
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (err) {
    if (err.code !== 'auth/popup-closed-by-user') showError(err.message);
  } finally {
    $('loginBtn').disabled = false;
  }
});

$('outBtn').addEventListener('click', async () => {
  await signOut(auth);
  contacts = [];
  $('app').style.display = 'none';
  $('login').style.display = 'block';
});

$('filter').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  render(!q ? contacts : contacts.filter(c => [
    c.name, c.email, c.roles.join(' '), c.sign_address || '',
    shortUA(c.user_agent), shortRef(c.referer)
  ].join(' ').toLowerCase().includes(q)));
});

$('csvBtn').addEventListener('click', () => {
  const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  // Full user agent and referrer here, not the abbreviated display forms --
  // the export is the audit artifact.
  const csv = [
    ['Name', 'Email', 'Phone', 'SMS Consent', 'Roles', 'Sign Address', 'Signed Up', 'User Agent', 'Referrer'].join(','),
    ...contacts.map(c => [
      cell(c.name), cell(c.email), cell(c.phone),
      cell(c.sms_consent ? 'yes' : 'no'),
      cell(c.roles.join('; ')), cell(c.sign_address || ''), cell(c.created_at),
      cell(c.user_agent), cell(c.referer)
    ].join(','))
  ].join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `kyle4fay-volunteers-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
